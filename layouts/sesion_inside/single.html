{{ define "main" }}
<main id="main" class="projects-editorial project-detail">
  {{ partial "project-heading" . }}
  <div class="project-gallery project-single-photo">
    {{ $photo := . }}{{ with .Params.images }}
    <figure class="project-photo"><a href="{{ index . 0 | relURL }}" data-gallery-item data-caption="{{ $photo.Content | plainify }}"><img src="{{ index . 0 | relURL }}" alt="{{ $photo.Content | plainify | default $photo.Title }}"></a><figcaption>{{ $photo.Content }}</figcaption></figure>
    {{ end }}
  </div>
  {{ with .Parent }}<a class="project-text-link project-return" href="{{ .RelPermalink }}">← Volver a {{ .Title }}</a>{{ end }}
</main>
{{ end }}
