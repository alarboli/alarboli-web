{{ define "main" }}
<main id="main" class="site-editorial editorial-person">
  <nav class="ed-breadcrumb" aria-label="Ruta de navegación"><a href="{{ "/equipo/" | relURL }}">Equipo</a><span aria-hidden="true">/</span><span aria-current="page">{{ .Title }}</span></nav>
  <div class="person-layout"><aside class="person-photo">{{ with .Params.images }}{{ $image := index . 0 }}{{ if gt (len .) 1 }}{{ $image = index . 1 }}{{ end }}<img src="{{ $image | relURL }}" alt="{{ $.Title }}" decoding="async">{{ end }}</aside><article><header class="ed-heading"><p class="ed-eyebrow">{{ .Params.rol }}</p><h1>{{ .Title }}</h1></header><div class="ed-prose">{{ .Content }}</div></article></div>
  <a class="ed-text-link ed-return" href="{{ "/equipo/" | relURL }}">← Conoce al equipo completo</a>
</main>
{{ end }}
