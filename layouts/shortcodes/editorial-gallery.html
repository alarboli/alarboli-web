<section class="project-gallery-section" aria-label="Fotografías del proyecto">
  <h2>El encuentro, en imágenes</h2>
  <p class="project-gallery-hint">Selecciona una fotografía para ampliarla.</p>
  <div class="project-gallery">
    {{ $title := .Page.Title }}{{ range $index, $image := .Page.Params.images }}
    <figure class="project-photo">
      <a href="{{ $image | relURL }}" data-gallery-item data-caption="{{ $title }} · Fotografía {{ add $index 1 }}" aria-label="Ampliar fotografía {{ add $index 1 }}">
        <img src="{{ $image | relURL }}" alt="{{ $title }} — fotografía {{ add $index 1 }}" loading="lazy" decoding="async"><span class="project-photo-expand" aria-hidden="true">↗</span>
      </a>
    </figure>
    {{ end }}
  </div>
</section>
